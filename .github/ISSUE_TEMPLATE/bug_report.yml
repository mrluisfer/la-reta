name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, and what you got instead of what you expected.
      placeholder: |
        1. Open /players
        2. Tap a card
        3. The page stays blank
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Web
        - App
        - Both
        - Not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, OS and browser
      placeholder: iPhone 14 Pro - Safari - iOS 18
