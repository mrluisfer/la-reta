name: Idea
description: Suggest something new or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like
      description: And what is awkward today without it.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Web
        - App
        - Both
        - Not sure
    validations:
      required: true
